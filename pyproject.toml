[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adsum"
version = "3.2.0"
description = "Cross-platform meeting recorder with dual-channel capture and transcription pipeline."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "ADsum"}]
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.24",
    "typer>=0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.6",
    "openai>=1.12",
    "sounddevice>=0.4",
    "soundcard>=0.4.3",
    "miniaudio>=1.61",
]

[project.scripts]
adsum = "adsum.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["adsum*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]

