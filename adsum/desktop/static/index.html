<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADsum</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="mast">
        <div>
          <p class="eyebrow">ADsum v2</p>
          <h1>Meeting Recorder</h1>
        </div>
        <div class="status-pill" id="statePill">Idle</div>
      </section>

      <section class="layout">
        <aside class="panel control-panel">
          <div class="field">
            <label for="sessionName">Session</label>
            <input id="sessionName" type="text" placeholder="Weekly sync" />
          </div>

          <div class="field">
            <label for="micSelect">Microphone</label>
            <select id="micSelect"></select>
            <p class="warning" id="micWarning"></p>
          </div>

          <div class="field">
            <label for="speakerSelect">System audio</label>
            <select id="speakerSelect"></select>
            <p class="warning" id="speakerWarning"></p>
          </div>

          <div class="button-grid">
            <button id="refreshBtn" class="secondary">Refresh</button>
            <button id="testBtn" class="secondary">Test 6 s</button>
            <button id="recordBtn" class="primary">Record</button>
            <button id="stopBtn" class="danger" disabled>Stop</button>
          </div>

          <div class="key-box">
            <label for="apiKey">OpenAI key</label>
            <div class="key-row">
              <input id="apiKey" type="password" autocomplete="off" placeholder="sk-..." />
              <button id="saveKeyBtn" class="secondary">Save</button>
            </div>
            <p class="key-state" id="keyState">Checking key...</p>
          </div>
        </aside>

        <section class="workspace">
          <section class="panel meters-panel">
            <div class="section-title">
              <h2>Levels</h2>
              <span id="elapsedText">00:00</span>
            </div>
            <div class="meter-row">
              <span>Mic</span>
              <div class="meter"><div id="micMeter"></div></div>
            </div>
            <div class="meter-row">
              <span>System</span>
              <div class="meter"><div id="systemMeter"></div></div>
            </div>
          </section>

          <section class="panel result-panel">
            <div class="section-title">
              <h2>Last Recording</h2>
              <button id="transcribeBtn" class="secondary" disabled>Transcribe</button>
            </div>
            <div id="resultBox" class="result-box">No recording yet.</div>
          </section>

          <section class="panel transcript-panel">
            <div class="section-title">
              <h2>Transcript</h2>
              <span id="transcriptState">Ready</span>
            </div>
            <pre id="transcriptBox">Record audio, then transcribe.</pre>
          </section>
        </section>
      </section>
    </main>
    <div id="toast" class="toast" hidden></div>
    <script src="/app.js"></script>
  </body>
</html>
